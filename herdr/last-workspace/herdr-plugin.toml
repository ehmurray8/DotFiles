id = "dotfiles.last-workspace"
name = "Last Workspace"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Switch between the current and immediately previous Herdr workspaces."
platforms = ["macos", "linux"]

[[actions]]
id = "toggle"
title = "Switch to last workspace"
command = ["./last-workspace", "toggle"]

[[events]]
on = "workspace.focused"
command = ["./last-workspace", "track"]
